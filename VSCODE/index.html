<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人簡介與作品集</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .card h2 {
            color: #2a5298;
            margin-bottom: 1rem;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 0.5rem;
        }
        ul {
            list-style-type: square;
            padding-left: 1.2rem;
        }
        li {
            margin-bottom: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>歡迎來到我的個人網站</h1>
        <p>這是一個使用 HTML/CSS 製作的專案頁面</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>關於我</h2>
            <p>你好！這是我在 Git 與 GitHub 課程中設計的個人專案頁面。透過這個專案，我學習了網頁建置與版本控制的基礎知識。</p>
        </div>

        <div class="card">
            <h2>學習目標與成果</h2>
            <ul>
                <li>學習 使用 Visual Studio Code 進行網頁開發</li>
                <li>掌握 Git 版本控制與 GitHub 託管服務</li>
                <li>利用 GitHub Pages 將靜態網頁發布上線</li>
            </ul>
        </div>
    </div>

    <footer>
        <p>© 2026 個人專案作品集 | 使用 GitHub Pages 發布</p>
    </footer>

</body>
</html>
